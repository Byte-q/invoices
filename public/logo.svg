<!-- File: invoice-shield-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" aria-hidden="true" role="img">
  <!-- Shield base -->
  <path fill="#FFFFFF" d="M24 3.5c-.3 0-.6.1-.8.3L9 11.8c-.8.5-1.2 1.4-1.1 2.3 1.1 9 5.5 15.5 11.9 19.7 4.1 2.8 7.5 4.4 7.8 4.6.6.4 1.4.4 2 0 .3-.2 3.7-1.9 7.8-4.6 6.4-4.2 10.8-10.7 11.9-19.7.1-.9-.3-1.8-1.1-2.3L24.8 3.8c-.2-.2-.5-.3-.8-.3z" />

  <!-- Document inside shield (white fill keeps it white; we use a subtle punched-out effect by slightly offsetting) -->
  <g transform="translate(9,8)">
    <!-- document background (slightly inset to show shield rim if used on colored background) -->
    <rect x="6" y="3" width="22" height="28" rx="1.8" ry="1.8" fill="#FFFFFF"/>
    <!-- folded corner -->
    <path fill="#FFFFFF" d="M28 3v7.5c0 .8-.7 1.5-1.5 1.5H20V3H28z"/>
    <!-- invoice lines -->
    <rect x="9" y="11" width="12" height="1.8" rx="0.9" fill="#FFFFFF"/>
    <rect x="9" y="15.5" width="16" height="1.8" rx="0.9" fill="#FFFFFF"/>
    <rect x="9" y="20" width="8" height="1.8" rx="0.9" fill="#FFFFFF"/>
    <!-- small check / secure mark -->
    <path fill="#FFFFFF" d="M12 24.5c.3 0 .5.1.7.3l3 2.6c.4.3.4.9.1 1.3-.3.4-.9.4-1.3.1L12 26.1l-1.4 1.1c-.4.3-1 .3-1.3-.1-.3-.4-.3-1 .1-1.3l2-1.6c.2-.2.4-.3.7-.3z"/>
  </g>
</svg>